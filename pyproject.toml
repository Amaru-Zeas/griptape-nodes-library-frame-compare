[project]
name = "griptape-nodes-library-frame-compare"
version = "0.3.0"
description = "Frame Compare: plate and mask review with four quadrants, stepped by frame."
authors = [
    { name = "Griptape Community" }
]
requires-python = ">=3.11"
dependencies = [
    "griptape-nodes",
]

[tool.uv.sources]
griptape-nodes = { git = "https://github.com/griptape-ai/griptape-nodes", rev = "latest" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frame_compare_nodes"]



